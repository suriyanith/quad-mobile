# Revyl config for Quad mobile (Expo). Recipe generated by `revyl init`, trimmed to the iOS preview build.
project:
    id: 02958253-64e3-4214-a138-683e600dccaf
session:
    idle_timeout_seconds: 1800
build:
    framework: expo
    env:
        # Inlined into the JS bundle at build time (.env.local is git-ignored).
        EXPO_PUBLIC_QUAD_URL: https://quad-flame-two.vercel.app
        # EXPO_PUBLIC_CONVEX_URL: https://<name>.convex.cloud   # add once the Convex cloud deployment exists
    profiles:
        preview:
            ios:
                app_id: "3829cb32-12d5-4c67-9af0-934022af667d"
                setup_commands:
                    - npm install
                    - if [ ! -d ios ]; then npx expo prebuild --platform ios --no-install; fi
                build_commands:
                    - cd ios && if [ ! -d Pods ]; then pod install; fi && WS=$(ls -d *.xcworkspace | head -n 1) && xcodebuild -workspace "$WS" -scheme "${WS%.xcworkspace}" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 -derivedDataPath build
                output_path: ios/build/Build/Products/Release-iphonesimulator/*.app
pr_review:
    enabled: true
    build:
        kind: revyl
        profile: preview
    proof_of_changes:
        enabled: true
        harness:
            kind: revyl
